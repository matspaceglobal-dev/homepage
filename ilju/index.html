<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 일주 찾기 | 맛스페이스</title>
<meta name="description" content="생년월일만 넣으면 나의 일주와 일주 아바타를 바로 알려드려요. 맛스페이스 일주 찾기.">
<meta property="og:title" content="내 일주 찾기 | 맛스페이스">
<meta property="og:description" content="생년월일로 나의 일주 아바타를 찾아보세요.">
<meta name="theme-color" content="#151515">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<style>
  .il-body { padding: 64px 0 110px; }
  .il-card { max-width: 560px; margin: 0 auto; background: var(--gray-50); border-radius: var(--radius-lg); padding: 40px 34px; }
  .il-card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .il-sub { color: var(--gray-600); font-size: 15px; margin: 0 0 24px; }
  .il-fields { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  .il-field label { display: block; font-size: 13px; font-weight: 800; color: var(--gray-600); margin: 0 0 6px 4px; }
  .il-field input { width: 100%; padding: 15px 16px; font-size: 18px; font-weight: 800; text-align: center; border-radius: 18px; border: 2px solid var(--gray-100);
    background: var(--paper); color: var(--ink); font-family: inherit; outline: none; transition: border-color .2s; -moz-appearance: textfield; }
  .il-field input::-webkit-outer-spin-button, .il-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .il-field input:focus { border-color: var(--ink); }
  .il-go { width: 100%; margin-top: 18px; padding: 17px; font-size: 17px; }
  .il-err { min-height: 20px; margin: 12px 4px 0; font-size: 14px; font-weight: 700; color: #d6402e; }
  .il-note { margin: 18px 4px 0; font-size: 13px; color: var(--gray-400); line-height: 1.55; word-break: keep-all; }
  [hidden] { display: none !important; }

  .il-result { text-align: center; }
  .il-av { width: min(240px, 70%); aspect-ratio: 1; object-fit: contain; display: block; margin: 0 auto 8px; background: var(--paper); border-radius: 50%; padding: 14px; }
  .il-chip { display: inline-block; font-size: 13px; font-weight: 800; background: var(--ink); color: var(--yellow); padding: 7px 14px; border-radius: 999px; margin-bottom: 12px; }
  .il-name { font-size: clamp(40px, 9vw, 56px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 0; }
  .il-hanja { font-size: 18px; color: var(--gray-400); font-weight: 700; margin: 4px 0 14px; }
  .il-title { font-size: 18px; font-weight: 800; margin: 0 0 8px; word-break: keep-all; }
  .il-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 26px; text-align: left; }
  .il-i { background: var(--paper); border-radius: 22px; padding: 16px 14px 15px; }
  .il-i small { display: block; font-size: 12px; font-weight: 800; color: var(--gray-400); letter-spacing: .02em; margin-bottom: 8px; }
  .il-i b { display: flex; align-items: center; gap: 7px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
  .il-i em { display: block; font-style: normal; font-size: 13px; font-weight: 700; color: var(--gray-400); margin-top: 5px; min-height: 17px; }
  .il-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .e-목 { background: #5BBF4A; } .e-화 { background: #F0503C; } .e-토 { background: #E9B730; } .e-금 { background: #B9BCC2; } .e-수 { background: #3C8CE8; }
  .il-actions { display: grid; gap: 10px; }
  .il-links { margin-top: 16px; font-size: 14px; }
  .il-links a { font-weight: 800; border-bottom: 3px solid var(--yellow); }
  @media (max-width: 560px) { .il-card { padding: 30px 20px; } .il-body { padding-top: 40px; } .il-info { gap: 8px; } .il-i { padding: 14px 10px 13px; } .il-i b { font-size: 20px; } }
</style>
</head>
<body data-root="../" data-page="ilju" data-title-en="Find My Ilju | Mat Space">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="blob blob-1" aria-hidden="true"></div>
      <div class="container">
        <h1 data-en="Find My Ilju">내 일주 찾기</h1>
        <p data-en="Enter your birth date and meet your Ilju avatar.">생년월일만 넣으면 나의 일주 아바타를 알려드려요.</p>
      </div>
    </section>

    <section class="il-body">
      <div class="container">
        <!-- 입력 -->
        <form class="il-card" id="form" novalidate>
          <h2 data-en="Your birth date">생년월일을 입력해 주세요</h2>
          <p class="il-sub" data-en="Solar (regular) calendar date">양력 기준이에요</p>
          <div class="il-fields">
            <div class="il-field"><label for="y" data-en="Year">년</label><input id="y" type="number" inputmode="numeric" placeholder="1990" min="1900" max="2100"></div>
            <div class="il-field"><label for="m" data-en="Month">월</label><input id="m" type="number" inputmode="numeric" placeholder="5" min="1" max="12"></div>
            <div class="il-field"><label for="d" data-en="Day">일</label><input id="d" type="number" inputmode="numeric" placeholder="15" min="1" max="31"></div>
          </div>
          <p class="il-err" id="err" role="alert"></p>
          <button class="btn btn-yellow il-go" type="submit" data-en="Find my Ilju">일주 확인하기</button>
          <p class="il-note" data-en="Based on the solar birth date only. Birth time is not reflected.">양력 생년월일 기준이며, 태어난 시간은 반영하지 않아요.</p>
        </form>

        <!-- 결과 -->
        <div class="il-card il-result" id="result" hidden>
          <img class="il-av" id="avImg" alt="">
          <span class="il-chip" id="chip"></span>
          <p class="il-name" id="name"></p>
          <p class="il-hanja" id="hanja"></p>
          <p class="il-title" id="title"></p>
          <div class="il-info" id="info"></div>
          <div class="il-actions">
            <a class="btn btn-yellow" id="goToday" data-en="See my condition today">오늘 내 컨디션 보러가기</a>
            <a class="btn btn-dark" id="goPhoto" data-en="Go to Saju Avatar Photo Booth">사주 아바타 포토부스 가기</a>
            <button class="btn btn-line" id="again" type="button" data-en="Enter again">다시 입력하기</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="../config.js"></script>
  <script src="../today/saju.js"></script>
  <script src="../today/i18n.js"></script>
  <script>
  (function () {
    const $ = s => document.querySelector(s);
    const lang = () => (window.MATSPACE_LANG ? window.MATSPACE_LANG() : "ko");
    const tr = (ko, en) => (lang() === "en" ? en : ko);
    let current = null, errKey = null;

    function showErr(ko, en) { errKey = [ko, en]; $("#err").textContent = tr(ko, en); }
    function clearErr() { errKey = null; $("#err").textContent = ""; }

    const BR_ELEM = { "자": "수", "축": "토", "인": "목", "묘": "목", "진": "토", "사": "화", "오": "화", "미": "토", "신": "금", "유": "금", "술": "토", "해": "수" };
    const EL_HANJA = { "목": "木", "화": "火", "토": "土", "금": "金", "수": "水" };
    const STEM_HANJA = "甲乙丙丁戊己庚辛壬癸", BR_HANJA = "子丑寅卯辰巳午未申酉戌亥";
    function renderInfo(g, L) {
      const stem = g[0], br = g[1], se = SAJU.elementOf(stem), be = BR_ELEM[br];
      const sh = STEM_HANJA[SAJU.STEMS.indexOf(stem)], bh = BR_HANJA[SAJU.BRANCHES.indexOf(br)];
      let cards;
      if (L === "ko") {
        cards = [
          ["나의 일간", stem + se, sh + EL_HANJA[se], se],
          ["나의 일지", br + be, bh + EL_HANJA[be], be],
          ["나의 일지동물", SAJU.ANIMAL[br], "", null]
        ];
      } else {
        const rm = I18N.iljuName(g, "en").split("-").map(x => x[0].toUpperCase() + x.slice(1));
        cards = [
          ["My Day Stem", I18N.ELEM_EN[se], rm[0] + " · " + sh, se],
          ["My Day Branch", I18N.ELEM_EN[be], rm[1] + " · " + bh, be],
          ["My Branch Animal", I18N.ANIMAL_EN[br], "", null]
        ];
      }
      $("#info").innerHTML = cards.map(c => `<div class="il-i"><small>${c[0]}</small><b>${c[3] ? `<span class="il-dot e-${c[3]}"></span>` : ""}${c[1]}</b><em>${c[2]}</em></div>`).join("");
    }

    function renderResult() {
      if (!current) return;
      const g = current, L = lang();
      $("#avImg").src = "../today/img/" + g + ".webp"; $("#avImg").alt = I18N.avatarName(g, L);
      $("#chip").textContent = tr("나의 일주", "My Ilju");
      $("#name").textContent = I18N.iljuName(g, L);
      $("#hanja").textContent = L === "ko" ? I18N.iljuHanja(g) : I18N.avatarName(g, L);
      $("#title").textContent = I18N.title(g, L);
      renderInfo(g, L);
      $("#goPhoto").href = "../photo/?ilju=" + encodeURIComponent(g) + (L === "en" ? "&lang=en" : "");
      $("#goToday").href = "../today/index.html?ilju=" + encodeURIComponent(g) + (L === "en" ? "&lang=en" : "");
    }

    $("#form").addEventListener("submit", e => {
      e.preventDefault(); clearErr();
      const y = parseInt($("#y").value, 10), m = parseInt($("#m").value, 10), d = parseInt($("#d").value, 10);
      if (!y || !m || !d) return showErr("년, 월, 일을 모두 입력해 주세요.", "Please fill in year, month and day.");
      if (y < 1900 || y > 2100) return showErr("1900~2100년 사이로 입력해 주세요.", "Please enter a year between 1900 and 2100.");
      const dt = new Date(y, m - 1, d, 12);
      if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return showErr("존재하지 않는 날짜예요. 다시 확인해 주세요.", "That date doesn’t exist. Please check again.");
      current = SAJU.dayPillar(dt).name;
      renderResult();
      $("#form").hidden = true; $("#result").hidden = false; window.scrollTo({ top: 0, behavior: "smooth" });
    });
    $("#again").addEventListener("click", () => { $("#result").hidden = true; $("#form").hidden = false; current = null; clearErr(); $("#y").focus(); });
    window.addEventListener("langchange", () => { if (errKey) $("#err").textContent = tr(errKey[0], errKey[1]); renderResult(); });
  })();
  </script>
  <script src="../layout.js"></script>
</body>
</html>
