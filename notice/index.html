<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공고 | 맛스페이스 Mat Space</title>
  <meta name="description" content="맛스페이스의 공고를 안내합니다. Official notices from Mat Space." />
  <meta name="theme-color" content="#151515" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-root="../" data-page="notice" data-title-en="Notice | Mat Space">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="blob blob-1" aria-hidden="true"></div>
      <div class="container">
        <p class="breadcrumb" data-en="Company › <b>Notice</b>">회사 › <b>공고</b></p>
        <h1 data-en="Notice">공고</h1>
        <p data-en="Official notices from Mat Space.">맛스페이스의 공고를 안내해요.</p>
      </div>
    </section>

    <section class="section" style="padding-bottom: 0;">
      <div class="container">
        <div class="disc-head">
          <div class="admin-bar" id="adminBar" hidden>
            <span class="admin-chip" data-en="Admin mode">관리자 모드</span>
            <button class="btn btn-dark btn-sm" id="btnNew" data-en="+ New notice">+ 공고 등록</button>
            <button class="btn btn-line btn-sm" id="btnLogout" data-en="Log out">로그아웃</button>
          </div>
        </div>
        <div class="disc-list" id="discList">
          <p class="disc-empty" data-en="Loading…">불러오는 중이에요…</p>
        </div>
        <div class="center" style="margin-top: 24px;">
          <button class="btn btn-line btn-sm" id="btnMore" hidden data-en="Show more">더보기</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- ========== 관리자 로그인 창 ========== -->
  <div class="modal" id="loginModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <h3 id="loginTitle" data-en="Admin login">관리자 로그인</h3>
      <p class="modal-desc" data-en="We&#39;ll send a login link to the admin email.<br />Click the link in your inbox to log in.">관리자 이메일로 로그인 링크를 보내드려요.<br />메일함에서 링크를 누르면 바로 로그인돼요.</p>
      <form id="loginForm">
        <label class="field">
          <span data-en="Email">이메일</span>
          <input type="email" id="loginEmail" required placeholder="관리자 이메일" data-en-placeholder="Admin email" autocomplete="email" />
        </label>
        <button type="submit" class="btn btn-dark btn-block" data-en="Send login link">로그인 링크 받기</button>
      </form>
      <p class="modal-msg" id="loginMsg"></p>
    </div>
  </div>

  <!-- ========== 공고 작성/수정 창 ========== -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-box modal-wide" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <h3 id="editTitle">공고 등록</h3>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <label class="field">
          <span data-en="Title">제목</span>
          <input type="text" id="editTitleInput" required maxlength="120" placeholder="공고 제목" data-en-placeholder="Notice title" />
        </label>
        <label class="field">
          <span data-en="Date">게시일</span>
          <input type="date" id="editDate" required />
        </label>
        <label class="field">
          <span data-en="Content">내용</span>
          <textarea id="editContent" rows="10" placeholder="내용을 입력하세요. 줄바꿈도 그대로 표시돼요." data-en-placeholder="Write the notice. Line breaks are kept as they are."></textarea>
        </label>
        <div class="btn-row end">
          <button type="button" class="btn btn-line" data-close data-en="Cancel">취소</button>
          <button type="submit" class="btn btn-dark" id="btnSave" data-en="Save">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="../layout.js"></script>
  <script src="../notice.js"></script>
</body>
</html>
